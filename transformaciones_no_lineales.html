<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D nonlinear transformation visualizer</title>
    <!-- Tailwind CSS para un diseño moderno y responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* Estilo para el cursor al interactuar con el canvas */
        canvas:active { cursor: grabbing; }
        canvas { cursor: grab; }
        /* Estilo para la flecha sobre los vectores */
        .vector-arrow { position: relative; }
        .vector-arrow::after {
            content: '→';
            position: absolute;
            top: -0.8em;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1em;
            font-weight: bold;
        }
    </style>
    <link rel="stylesheet" href="laboratorio.css">
    <script src="i18n.js"></script>
</head>
<body class="lab-page bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen p-4" data-title-en="2D nonlinear transformation visualizer" data-title-es="Visualizador de transformaciones no-lineales en dos dimensiones">
    <nav class="site-nav" aria-label="Navegación principal">
        <div class="site-nav__inner">
            <a class="site-nav__brand" href="index.html">
                <span class="site-nav__mark" aria-hidden="true">λ</span>
                <span class="site-nav__label"><span>Laboratorio lineal</span><small>Transformaciones no lineales</small></span>
            </a>
            <div class="site-nav__links"><a href="index.html#experimentos">Todos los módulos</a><a href="index.html">← Inicio</a></div>
        </div>
    </nav>
    <div id="app"></div>

    <script type="text/babel">
        // ===================================================================================
        // CONSTANTES Y FUNCIONES AUXILIARES
        // ===================================================================================

        /** Dibuja una flecha en el canvas. Si la longitud es casi cero, dibuja un punto. */
        function drawArrow(ctx, x1, y1, x2, y2, s) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const length = Math.hypot(dx, dy);

            if (length < 0.01) {
                ctx.beginPath();
                ctx.arc(x1, y1, s / 2, 0, 2 * Math.PI);
                ctx.fill();
                return;
            }

            const a = Math.atan2(dy, dx);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - s * Math.cos(a - Math.PI / 6), y2 - s * Math.sin(a - Math.PI / 6));
            ctx.lineTo(x2 - s * Math.cos(a + Math.PI / 6), y2 - s * Math.sin(a + Math.PI / 6));
            ctx.closePath(); ctx.fill();
        }

        /** Dibuja una cruz de referencia en el canvas */
        function drawCrosshair(ctx, x, y, s) {
            ctx.beginPath(); ctx.arc(x, y, s, 0, 2 * Math.PI, false);
            ctx.moveTo(x, y + s / 2); ctx.lineTo(x, y + s * 1.5); ctx.moveTo(x, y - s / 2); ctx.lineTo(x, y - s * 1.5);
            ctx.moveTo(x + s / 2, y); ctx.lineTo(x + s * 1.5, y); ctx.moveTo(x - s / 2, y); ctx.lineTo(x - s * 1.5, y);
            ctx.stroke();
        }

        // ===================================================================================
        // DEFINICIÓN DE LAS TRANSFORMACIONES NO-LINEALES
        // ===================================================================================
        const nonlinearTransformations = {
            affine: {
                name: 'Desplazamiento',
                func: (x, y) => [x + 1.5, y + 1],
                formula: "T(x, y) = (x + 1.5, y + 1)"
            },
            quadratic: {
                name: 'Término Cuadrático',
                func: (x, y) => [x, y + 0.2 * x * x],
                formula: "T(x, y) = (x, y + 0.2x²)"
            },
            sine_wave: {
                name: 'Onda Sinusoidal',
                func: (x, y) => [x, y + Math.sin(x * 2) * 1.5],
                formula: "T(x, y) = (x, y + 1.5sin(2x))"
            },
             complex_squaring: {
                name: 'Cuadrado Complejo',
                func: (x, y) => [0.2 * (x*x - y*y), 0.2 * (2*x*y)],
                formula: "T(x, y) = 0.2 · (x² - y², 2xy)"
            },
            sine_coupling: {
                name: 'Acoplamiento Sinusoidal',
                func: (x, y) => [x + 0.8 * Math.sin(y * 1.5), y + 0.8 * Math.sin(x * 1.5)],
                formula: "T(x,y)=(x+0.8sin(1.5y), y+0.8sin(1.5x))"
            },
            swirl: {
                name: 'Torbellino',
                func: (x, y) => {
                    const r = Math.hypot(x, y);
                    const angle = Math.atan2(y, x);
                    const swirlAngle = r * 0.5;
                    return [
                        r * Math.cos(angle + swirlAngle),
                        r * Math.sin(angle + swirlAngle)
                    ];
                },
                formula: "T(x,y)=(x·cos(α)-y·sin(α), x·sin(α)+y·cos(α)), α=0.5√(x²+y²)"
            },
            absolute_value: {
                name: 'Valor Absoluto (Plegado)',
                func: (x, y) => [Math.abs(x), y],
                formula: "T(x, y) = (|x|, y)"
            },
            product: {
                name: 'Producto de Componentes',
                func: (x, y) => [x, y * x * 0.5],
                formula: "T(x, y) = (x, 0.5xy)"
            }
        };


        // ===================================================================================
        // HOOK PERSONALIZADO PARA LA LÓGICA DE ANIMACIÓN
        // ===================================================================================
        function useAnimation(initialState = {}) {
            const { initialT = 0, initialIsPlaying = false, initialIsLooping = false, initialSpeed = 1 } = initialState;
            const [t, setT] = React.useState(initialT);
            const [isPlaying, setIsPlaying] = React.useState(initialIsPlaying);
            const [isLooping, setIsLooping] = React.useState(initialIsLooping);
            const [animationSpeed, setAnimationSpeed] = React.useState(initialSpeed);
            const animationFrameId = React.useRef(null); const lastTimeRef = React.useRef(null);
            const tRef = React.useRef(t); tRef.current = t;
            React.useEffect(() => {
                if (!isPlaying) { cancelAnimationFrame(animationFrameId.current); return; }
                const animate = (currentTime) => {
                    if (lastTimeRef.current === null) lastTimeRef.current = currentTime;
                    const deltaTime = currentTime - lastTimeRef.current;
                    lastTimeRef.current = currentTime;
                    setT(prevT => { const newT = prevT + (deltaTime / 1000) * (animationSpeed * 0.5); return newT < 1 ? newT : 1; });
                    animationFrameId.current = requestAnimationFrame(animate);
                };
                lastTimeRef.current = null; animationFrameId.current = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationFrameId.current);
            }, [isPlaying, animationSpeed]);
            React.useEffect(() => { if (t >= 1) { if (isLooping) setT(0); else setIsPlaying(false); } }, [t, isLooping]);
            const handlePlayPause = React.useCallback(() => { if (tRef.current >= 1) { setT(0); setIsPlaying(true); } else { setIsPlaying(prev => !prev); } }, []);
            const handleLoopToggle = React.useCallback(() => setIsLooping(prev => !prev), []);
            const handleTSlider = React.useCallback((e) => setT(parseFloat(e.target.value)), []);
            const handleSpeedSlider = React.useCallback((e) => setAnimationSpeed(parseFloat(e.target.value)), []);
            const handleTMouseDown = React.useCallback(() => setIsPlaying(false), []);
            return { t, setT, isPlaying, setIsPlaying, isLooping, animationSpeed, handlePlayPause, handleLoopToggle, handleTSlider, handleSpeedSlider, handleTMouseDown };
        }

        // ===================================================================================
        // COMPONENTES DE UI (MEMOIZADOS PARA OPTIMIZACIÓN)
        // ===================================================================================

        const CanvasComponent = React.memo(function CanvasComponent({ t, scale, vector, onVectorChange, transformationFunc, options }) {
            const canvasRef = React.useRef(null); const [isDragging, setIsDragging] = React.useState(false);

            const getMousePos = React.useCallback((event) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                const xRatio = scale * rect.width / canvas.width;
                const yRatio = -scale * rect.height / canvas.height;
                const x = ((event.clientX - rect.left) - rect.width / 2) / xRatio;
                const y = ((event.clientY - rect.top) - rect.height / 2) / yRatio;
                return { x, y };
            }, [scale]);

            const handlePointerDown = React.useCallback((event) => {
                if (!options.showArbitraryVector) return;
                const pos = getMousePos(event);
                const dist = Math.hypot(pos.x - vector.x, pos.y - vector.y);
                if (dist < 0.5) {
                    setIsDragging(true);
                    event.target.setPointerCapture(event.pointerId);
                }
            }, [getMousePos, vector, options.showArbitraryVector]);

            const handlePointerUp = React.useCallback((event) => { setIsDragging(false); event.target.releasePointerCapture(event.pointerId); }, []);

            const handlePointerMove = React.useCallback((event) => {
                if (!isDragging) return;
                let pos = getMousePos(event);
                const SNAP_MARGIN = 0.1; const xSnap = Math.round(pos.x * 2) / 2; const ySnap = Math.round(pos.y * 2) / 2;
                if (Math.abs(xSnap - pos.x) < SNAP_MARGIN) pos.x = xSnap;
                if (Math.abs(ySnap - pos.y) < SNAP_MARGIN) pos.y = ySnap;
                onVectorChange(pos);
            }, [isDragging, getMousePos, onVectorChange]);

            React.useEffect(() => {
                const canvas = canvasRef.current; const ctx = canvas.getContext('2d'); const t_num = parseFloat(t);
                ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2); ctx.scale(scale, -scale); ctx.lineWidth = 0.04;

                // Función que interpola entre la identidad y la transformación final
                const applyInterpolatedTransform = (x, y) => {
                    const [tx, ty] = transformationFunc(x, y);
                    const ix = (1 - t_num) * x + t_num * tx;
                    const iy = (1 - t_num) * y + t_num * ty;
                    return [ix, iy];
                };

                // Dibuja la rejilla de fondo
                ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 0.02;
                for (let i = -20; i <= 20; i++) { ctx.beginPath(); ctx.moveTo(i, -20); ctx.lineTo(i, 20); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-20, i); ctx.lineTo(20, i); ctx.stroke(); }

                // Dibuja la rejilla transformada con mayor resolución
                ctx.lineWidth = 0.04; ctx.strokeStyle = '#1fabc3';
                const steps = 300; // Aumentado para máxima suavidad
                const range = 20;
                const stepSize = (range * 2) / steps;

                // Líneas verticales
                for (let i = -range; i <= range; i++) {
                    ctx.beginPath();
                    ctx.moveTo(...applyInterpolatedTransform(i, -range));
                    for(let j = -range + stepSize; j <= range; j += stepSize) {
                        ctx.lineTo(...applyInterpolatedTransform(i, j));
                    }
                    ctx.stroke();
                }
                // Líneas horizontales
                for (let i = -range; i <= range; i++) {
                    ctx.beginPath();
                    ctx.moveTo(...applyInterpolatedTransform(-range, i));
                     for(let j = -range + stepSize; j <= range; j += stepSize) {
                        ctx.lineTo(...applyInterpolatedTransform(j, i));
                    }
                    ctx.stroke();
                }

                // Dibuja los ejes transformados
                ctx.strokeStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(...applyInterpolatedTransform(-range, 0));
                for(let i = -range + stepSize; i <= range; i += stepSize) { ctx.lineTo(...applyInterpolatedTransform(i, 0)); }
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(...applyInterpolatedTransform(0, -range));
                for(let i = -range + stepSize; i <= range; i += stepSize) { ctx.lineTo(...applyInterpolatedTransform(0, i)); }
                ctx.stroke();

                // Dibuja los vectores base originales (i, j) con transparencia
                ctx.globalAlpha = 0.5; ctx.strokeStyle = '#a0aec0'; ctx.fillStyle = '#a0aec0'; drawArrow(ctx, 0, 0, 1, 0, 0.2); drawArrow(ctx, 0, 0, 0, 1, 0.2); ctx.globalAlpha = 1.0;

                // Dibuja los vectores base transformados
                const iHatTransformed = applyInterpolatedTransform(1, 0); const jHatTransformed = applyInterpolatedTransform(0, 1);
                ctx.strokeStyle = '#8cbe63'; ctx.fillStyle = '#8cbe63'; drawArrow(ctx, 0, 0, ...iHatTransformed, 0.2);
                ctx.strokeStyle = '#ff7c5c'; ctx.fillStyle = '#ff7c5c'; drawArrow(ctx, 0, 0, ...jHatTransformed, 0.2);

                // Dibuja el vector arbitrario y su transformado (si está activado)
                if (options.showArbitraryVector) {
                    const vectorTransformed = applyInterpolatedTransform(vector.x, vector.y);
                    ctx.strokeStyle = '#fdfe00'; ctx.fillStyle = '#fdfe00';
                    drawArrow(ctx, 0, 0, ...vectorTransformed, 0.2);
                    drawCrosshair(ctx, vector.x, vector.y, 0.16);
                }

                ctx.restore();
            }, [t, vector, scale, transformationFunc, options]);

            return <canvas ref={canvasRef} width={1140} height={640} className="w-full bg-gray-800 rounded-md shadow-lg" onPointerDown={handlePointerDown} onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerCancel={handlePointerUp} />;
        });

        const AnimationControls = React.memo(({ animationState, handlers }) => {
            const PlayIcon = () => <svg className="w-6 h-6 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>;
            const PauseIcon = () => <svg className="w-6 h-6 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"></path></svg>;
            const LoopIcon = () => <svg className="w-6 h-6 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 2l4 4-4 4M3 12a9 9 0 019-9h9M7 22l-4-4 4-4M21 12a9 9 0 01-9 9H3"></path></svg>;
            return (
                <div className="grid grid-cols-1 md:grid-cols-[auto_1fr_1fr] items-center gap-x-6 gap-y-4 p-2 rounded-md bg-gray-900/50">
                    <div className="flex items-center justify-center md:justify-start gap-4">
                        <button onClick={handlers.onPlayPause} className="p-2 rounded-full hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-400">{animationState.isPlaying ? <PauseIcon /> : <PlayIcon />}</button>
                        <button onClick={handlers.onLoopToggle} className={`p-2 rounded-full hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-400 ${animationState.isLooping ? 'text-cyan-400' : ''}`}><LoopIcon /></button>
                    </div>
                    <div className="flex items-center gap-2 w-full">
                        <label htmlFor="t-slider" className="font-medium">t:</label>
                        <input id="t-slider" type="range" min="0" max="1" step="0.01" value={animationState.t} onMouseDown={handlers.onTMouseDown} onChange={handlers.onTSlider} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                        <span className="text-cyan-400 w-12 text-center">{Number(animationState.t).toFixed(2)}</span>
                    </div>
                    <div className="flex items-center gap-2 w-full">
                        <label htmlFor="speed-slider" className="font-medium">Velocidad:</label>
                        <input id="speed-slider" type="range" min="0.25" max="4" step="0.25" value={animationState.animationSpeed} onChange={handlers.onSpeedSlider} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                        <span className="text-cyan-400 w-12 text-center">{animationState.animationSpeed}x</span>
                    </div>
                </div>
            );
        });

        const DisplayOptions = React.memo(({ options, onOptionChange }) => {
            const Checkbox = ({ name, label }) => (
                <label className="flex items-center space-x-2 cursor-pointer text-sm">
                    <input
                        type="checkbox"
                        name={name}
                        checked={options[name]}
                        onChange={onOptionChange}
                        className="form-checkbox h-4 w-4 text-cyan-400 bg-gray-700 border-gray-600 rounded focus:ring-cyan-500"
                    />
                    <span>{label}</span>
                </label>
            );
            return (
                <div className="flex justify-center items-center mt-2">
                    <Checkbox name="showArbitraryVector" label="Mostrar vector arbitrario" />
                </div>
            );
        });

        const TransformationInfo = React.memo(({ vector, transformation, options }) => {
            const transformedVector = transformation.func(vector.x, vector.y);
            const FormattedNumber = ({ value, colorClass }) => { const [integer, fraction] = value.toFixed(2).split('.'); return <div className={`grid grid-cols-[1fr_auto_1fr] items-center font-mono text-xl ${colorClass}`}><span className="text-right">{integer}</span><span>.</span><span className="text-left">{fraction}</span></div>; };
            const Bracket = ({ side }) => <div className={`w-2 h-16 border-gray-500 ${side === 'left' ? 'border-l-2 border-t-2 border-b-2 rounded-l-md' : 'border-r-2 border-t-2 border-b-2 rounded-r-md'}`}></div>;
            const VectorLabel = ({ letter, colorClass }) => <div className={`text-xl font-bold italic vector-arrow ${colorClass}`}>{letter}</div>;

            return (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 p-4 bg-gray-800/50 rounded-lg border border-gray-700 min-h-[10rem]">
                    <div className="flex flex-col items-center justify-center gap-2">
                        <h2 className="text-lg font-bold text-cyan-300">{transformation.name}</h2>
                        <p className="font-mono text-cyan-400 text-center text-sm break-all px-2">{transformation.formula}</p>
                    </div>
                    <div className={`flex items-center justify-center gap-4 border-t-2 lg:border-t-0 lg:border-l-2 border-gray-700 pt-4 lg:pt-0 lg:pl-4 transition-opacity duration-300 ${options.showArbitraryVector ? 'opacity-100' : 'opacity-0'}`}>
                        <div className="flex flex-col items-center gap-1"><VectorLabel letter="v" colorClass="text-[#fdfe00]" /><div className="flex items-center gap-2"><Bracket side="left" /><div className="flex flex-col justify-center gap-2"><FormattedNumber value={vector.x} colorClass="text-[#fdfe00]" /><FormattedNumber value={vector.y} colorClass="text-[#fdfe00]" /></div><Bracket side="right" /></div></div>
                        <div className="text-2xl font-bold self-center">↦</div>
                        <div className="flex flex-col items-center gap-1"><div className="text-xl font-bold italic text-white">T(<span className="vector-arrow">v</span>)</div><div className="flex items-center gap-2"><Bracket side="left" /><div className="flex flex-col justify-center gap-2"><FormattedNumber value={transformedVector[0]} colorClass="text-white" /><FormattedNumber value={transformedVector[1]} colorClass="text-white" /></div><Bracket side="right" /></div></div>
                    </div>
                </div>
            );
        });

        // ===================================================================================
        // COMPONENTE APLICACIÓN PRINCIPAL (APP)
        // ===================================================================================

        function App() {
            const { t, setT, isPlaying, setIsPlaying, ...animation } = useAnimation();
            const [vector, setVector] = React.useState({ x: 1.5, y: 1.5 });
            const [currentTransformationKey, setCurrentTransformationKey] = React.useState('affine');
            const [options, setOptions] = React.useState({ showArbitraryVector: true });

            const currentTransformation = nonlinearTransformations[currentTransformationKey];

            const handleReset = React.useCallback(() => {
                setVector({ x: 1.5, y: 1.5 });
                setT(0);
                setIsPlaying(false);
            }, [setT, setIsPlaying]);

            const handleTransformationChange = (event) => {
                setCurrentTransformationKey(event.target.value);
                setT(0);
                setIsPlaying(false);
            };

            const handleOptionChange = React.useCallback((e) => {
                const { name, checked } = e.target;
                setOptions(prev => ({ ...prev, [name]: checked }));
            }, []);

            return (
                <div className="w-full max-w-6xl mx-auto flex flex-col gap-4">
                    <h1 className="text-2xl font-bold text-center text-cyan-300">
                        Visualizador de transformaciones no-lineales en dos dimensiones
                    </h1>
                    <div className="bg-gray-800/50 p-4 rounded-lg shadow-2xl backdrop-blur-sm border border-gray-700">
                        <div className="relative">
                            <CanvasComponent
                                t={t}
                                scale={60}
                                vector={vector}
                                onVectorChange={setVector}
                                transformationFunc={currentTransformation.func}
                                options={options}
                            />
                            <button onClick={handleReset} className="absolute top-3 right-3 p-2 rounded-full bg-gray-900/50 hover:bg-gray-700 transition-colors focus:outline-none focus:ring-2 focus:ring-cyan-400" title="Resetear Vector">
                                <svg className="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path></svg>
                            </button>
                        </div>
                        <div className="mt-4 flex flex-col gap-4">
                            <div className="flex flex-col md:flex-row gap-4 items-center">
                                <label htmlFor="transformation-select" className="font-medium whitespace-nowrap">Seleccionar Transformación:</label>
                                <select
                                    id="transformation-select"
                                    value={currentTransformationKey}
                                    onChange={handleTransformationChange}
                                    className="w-full p-2 bg-gray-700 border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-cyan-400"
                                >
                                    {Object.entries(nonlinearTransformations).map(([key, { name }]) => (
                                        <option key={key} value={key}>{name}</option>
                                    ))}
                                </select>
                            </div>
                            <AnimationControls
                                animationState={{ t, isPlaying, ...animation }}
                                handlers={{ onPlayPause: animation.handlePlayPause, onLoopToggle: animation.handleLoopToggle, onTSlider: animation.handleTSlider, onSpeedSlider: animation.handleSpeedSlider, onTMouseDown: animation.handleTMouseDown }}
                            />
                            <DisplayOptions options={options} onOptionChange={handleOptionChange} />
                        </div>
                    </div>
                    <TransformationInfo vector={vector} transformation={currentTransformation} options={options} />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('app')).render(<App />);
    </script>
</body>
</html>
