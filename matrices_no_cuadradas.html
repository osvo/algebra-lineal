    <style>
        body { margin: 0; background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .panel { background-color: #1e293b; padding: 1rem; border-radius: 0.5rem; border: 1px solid #334155; }
        .matrix-input { width: 100%; background-color: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 0.25rem; text-align: center; font-weight: bold; }
        .styled-select { background-color: #334155; border: 1px solid #475569; border-radius: 0.25rem; padding: 0.5rem; width: 100%; color: #e2e8f0; }

            position: absolute;
            top: 0.75rem;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(30, 41, 59, 0.7);

            border-radius: 9999px;
            font-weight: bold;
            font-size: 0.875rem;
            z-index: 10;
        }
        canvas { cursor: grab; }
        canvas:active { cursor: grabbing; }
        /* Colores para las columnas de la matriz */
        .col-i { color: #8cbe63 !important; }
        .col-j { color: #ff7c5c !important; }
        .col-k { color: #a78bfa !important; }
        .col-v { color: #facc15 !important; }
        /* Estilo para la flecha sobre el vector */
        .vector-arrow { position: relative; display: inline-block; }
        .vector-arrow::after {
            content: '→';
            position: absolute;
            top: -0.8em;
            left: 50%;
            transform: translateX(-50%);

            font-weight: bold;

<body class="lab-page p-4" data-title-en="Non-square matrix transformation visualizer" data-title-es="Visualizador de transformaciones con matrices no cuadradas">

    <div class="lab-static-root max-w-7xl mx-auto flex flex-col gap-4">
        <h1 class="text-2xl font-bold text-center text-cyan-300">Visualizador de transformaciones con matrices no cuadradas</h1>

        <div class="panel md:w-1/2 mx-auto">

             <select id="dim-select" class="styled-select">

            <div id="analysis-panel" class="panel">
                <div id="arbitrary-vector-container" class="pb-4 mb-4 border-b border-slate-700">

                        <input type="checkbox" id="use-arbitrary-vector-checkbox" class="form-checkbox h-4 w-4 text-cyan-400 bg-slate-700 rounded">

                    <div><span class="font-bold text-gray-400">Espacio Nulo (Ker(<span class="text-cyan-400">A</span>)):</span> <span id="kernel-value" class="text-purple-400 font-bold"></span></div>
                    <div id="transformed-vector-analysis" class="hidden pt-3 border-t border-slate-700">
                        <span class="font-bold text-gray-400"><span class="text-cyan-400">A</span><span class="text-yellow-400 vector-arrow">v</span> =</span>

    <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- State Management ---
        let state = {
            rows: 3,
            cols: 2,
            matrix: [],
            inputVis: null,
            outputVis: null,
            useArbitraryVector: false,
            arbitraryVector: [1, 1, 0],
            transformedVector: null,
        };

        const basisColors = { i: '#8cbe63', j: '#ff7c5c', k: '#a78bfa' }; // Verde, Rojo, Púrpura
        const arbitraryVectorColor = '#facc15'; // Amarillo
        const subspaceColor = '#60a5fa'; // Azul claro

        // --- Visualization Classes ---
        class CanvasBase {
            constructor(containerId) {
                this.container = document.getElementById(containerId);
                this.container.innerHTML = '';
            }
            update() {}
            dispose() { this.container.innerHTML = ''; }
        }

        class Canvas1D extends CanvasBase {
            constructor(containerId, isInput = false) {
                super(containerId);
                this.isInput = isInput;
                this.canvas = document.createElement('canvas');
                this.container.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.resize();
                window.addEventListener('resize', () => this.resize());
            }

            resize() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
                this.draw();
            }

            drawArrow(x1, y1, x2, y2, color, lineWidth = 2) {
                this.ctx.strokeStyle = color; this.ctx.fillStyle = color; this.ctx.lineWidth = lineWidth;
                const headlen = 10; const dx = x2 - x1; const angle = Math.atan2(0, dx);
                this.ctx.beginPath(); this.ctx.moveTo(x1, y1); this.ctx.lineTo(x2, y2); this.ctx.stroke();
                this.ctx.beginPath(); this.ctx.moveTo(x2, y2);
                this.ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                this.ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                this.ctx.closePath(); this.ctx.fill();
            }

            draw() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.fillStyle = '#e2e8f0'; this.ctx.strokeStyle = '#94a3b8'; this.ctx.lineWidth = 2;
                const centerY = this.canvas.height / 2; const centerX = this.canvas.width / 2; const scale = 40;
                this.ctx.beginPath(); this.ctx.moveTo(0, centerY); this.ctx.lineTo(this.canvas.width, centerY); this.ctx.stroke();
                const numTicks = Math.floor(this.canvas.width / (2 * scale));
                for (let i = -numTicks; i <= numTicks; i++) {
                    const x = centerX + i * scale;
                    this.ctx.beginPath(); this.ctx.moveTo(x, centerY - 5); this.ctx.lineTo(x, centerY + 5); this.ctx.stroke();
                    this.ctx.textAlign = 'center'; this.ctx.fillText(i, x, centerY + 20);
                }
                if (this.isInput) {
                    this.drawArrow(centerX, centerY, centerX + 1 * scale, centerY, basisColors.i);
                    if (state.useArbitraryVector) this.drawArrow(centerX, centerY, centerX + state.arbitraryVector[0] * scale, centerY, arbitraryVectorColor, 3);
                } else {
                    if(state.matrix && state.matrix.length > 0) {
                        for (let c = 0; c < state.cols; c++) this.drawArrow(centerX, centerY, centerX + state.matrix[0][c] * scale, centerY, Object.values(basisColors)[c]);
                        if (state.useArbitraryVector && state.transformedVector) this.drawArrow(centerX, centerY, centerX + state.transformedVector[0] * scale, centerY, arbitraryVectorColor, 3);
                    }
                }
            }
             update() { this.draw(); }
        }

        class Canvas2D extends CanvasBase {
            constructor(containerId, isInput = false) {
                super(containerId);
                this.isInput = isInput;
                this.canvas = document.createElement('canvas'); this.container.appendChild(this.canvas);
                this.ctx = this.canvas.getContext('2d');
                this.scale = 50; this.origin = { x: 0, y: 0 }; this.pan = { x: 0, y: 0 };
                this.isPanning = false; this.panStart = { x: 0, y: 0 }; this.dragTarget = null;
                this.addEventListeners(); this.resize();
            }

            resize() {
                this.canvas.width = this.container.clientWidth; this.canvas.height = this.container.clientHeight;
                this.origin.x = this.canvas.width / 2; this.origin.y = this.canvas.height / 2;
                this.draw();
            }

            getMousePos(event) {
                const rect = this.canvas.getBoundingClientRect();
                const x = (event.clientX - rect.left - (this.origin.x + this.pan.x)) / this.scale;
                const y = (event.clientY - rect.top - (this.origin.y + this.pan.y)) / -this.scale;
                return { x, y };
            }

            addEventListeners() {
                this.canvas.addEventListener('mousedown', (e) => {
                    if (!this.isInput) { this.isPanning = true; this.panStart.x = e.clientX - this.pan.x; this.panStart.y = e.clientY - this.pan.y; return; }

                    const pos = this.getMousePos(e);
                    const targets = [];
                    const row0 = state.matrix[0] || [];
                    const row1 = state.matrix[1] || [];

                    if (state.cols > 0) {
                        let iHandleX, iHandleY;
                        if (state.rows === 1) {
                            iHandleX = row0[0] !== undefined ? row0[0] : 1; iHandleY = 0;
                        } else {
                            iHandleX = row0[0] !== undefined ? row0[0] : 1; iHandleY = row1[0] !== undefined ? row1[0] : 0;
                        }
                        targets.push({ id: 'i', x: iHandleX, y: iHandleY });
                    }
                    if (state.cols > 1) {
                        let jHandleX, jHandleY;
                         if (state.rows === 1) {
                            jHandleX = row0[1] !== undefined ? row0[1] : 0; jHandleY = 0;
                        } else {
                            jHandleX = row0[1] !== undefined ? row0[1] : 0; jHandleY = row1[1] !== undefined ? row1[1] : 1;
                        }
                        targets.push({ id: 'j', x: jHandleX, y: jHandleY });
                    }
                    if (state.useArbitraryVector && state.cols === 2) {
                        targets.push({ id: 'v', x: state.arbitraryVector[0], y: state.arbitraryVector[1] });
                    }

                    let closest = null; let minDist = 0.5;
                    for (const target of targets) {
                        const dist = Math.hypot(pos.x - target.x, pos.y - target.y);
                        if (dist < minDist) { minDist = dist; closest = target.id; }
                    }
                    if (closest) { this.dragTarget = closest; }
                    else { this.isPanning = true; this.panStart.x = e.clientX - this.pan.x; this.panStart.y = e.clientY - this.pan.y; }
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    if (this.dragTarget) {
                        const pos = this.getMousePos(e);
                        const snappedX = Math.round(pos.x * 10) / 10;
                        const snappedY = Math.round(pos.y * 10) / 10;

                        if (this.dragTarget === 'v') {
                            document.getElementById('v0').value = snappedX.toFixed(1);
                            if(state.cols > 1) document.getElementById('v1').value = snappedY.toFixed(1);
                        } else if (this.dragTarget === 'i') {
                            const col = 0;
                            if (state.rows === 1) {
                                document.getElementById(`m0${col}`).value = snappedX.toFixed(1);
                            } else {
                                document.getElementById(`m0${col}`).value = snappedX.toFixed(1);
                                document.getElementById(`m1${col}`).value = snappedY.toFixed(1);
                                if (state.rows === 3) document.getElementById(`m2${col}`).value = '0';
                            }
                        } else if (this.dragTarget === 'j') {
                            const col = 1;
                            if (state.rows === 1) {
                                document.getElementById(`m0${col}`).value = snappedX.toFixed(1);
                            } else {
                                document.getElementById(`m0${col}`).value = snappedX.toFixed(1);
                                document.getElementById(`m1${col}`).value = snappedY.toFixed(1);
                                 if (state.rows === 3) document.getElementById(`m2${col}`).value = '0';
                            }
                        }
                        handleMatrixChange();
                    } else if (this.isPanning) {
                        this.pan.x = e.clientX - this.panStart.x; this.pan.y = e.clientY - this.panStart.y;
                        this.draw();
                    }
                });

                const stopDrag = () => { this.isPanning = false; this.dragTarget = null; };
                this.canvas.addEventListener('mouseup', stopDrag);
                this.canvas.addEventListener('mouseleave', stopDrag);
                this.canvas.addEventListener('wheel', (e) => { e.preventDefault(); const zoom = Math.exp((e.deltaY < 0 ? 1 : -1) * 0.1); this.scale *= zoom; this.draw(); });
            }

            draw() {
                const ctx = this.ctx; ctx.clearRect(0, 0, this.canvas.width, this.canvas.height); ctx.save();
                ctx.translate(this.origin.x + this.pan.x, this.origin.y + this.pan.y); ctx.scale(this.scale, -this.scale);

                const row0 = state.matrix[0] || [];
                const row1 = state.matrix[1] || [];

                if (this.isInput) {
                    this.drawGrid({x:1, y:0}, {x:0, y:1});
                    this.drawAxes({x:1, y:0}, {x:0, y:1});

                    if (state.cols > 0) this.drawArrow(0, 0, 1, 0, basisColors.i);
                    if (state.cols > 1) this.drawArrow(0, 0, 0, 1, basisColors.j);

                    if (state.cols > 0) {
                        let iHandleX, iHandleY;
                        if (state.rows === 1) {
                            iHandleX = row0[0] !== undefined ? row0[0] : 1; iHandleY = 0;
                        } else {
                            iHandleX = row0[0] !== undefined ? row0[0] : 1; iHandleY = row1[0] !== undefined ? row1[0] : 0;
                        }
                        this.drawCrosshair(iHandleX, iHandleY, basisColors.i);
                    }
                    if (state.cols > 1) {
                        let jHandleX, jHandleY;
                         if (state.rows === 1) {
                            jHandleX = row0[1] !== undefined ? row0[1] : 0; jHandleY = 0;
                        } else {
                            jHandleX = row0[1] !== undefined ? row0[1] : 0; jHandleY = row1[1] !== undefined ? row1[1] : 1;
                        }
                        this.drawCrosshair(jHandleX, jHandleY, basisColors.j);
                    }

                    if (state.useArbitraryVector) {
                        this.drawArrow(0, 0, state.arbitraryVector[0], state.arbitraryVector[1], arbitraryVectorColor, 0.07);
                        this.drawCrosshair(state.arbitraryVector[0], state.arbitraryVector[1], arbitraryVectorColor);
                    }
                } else {
                    if (state.cols === 1) {
                        const v = { x: row0[0] || 0, y: row1[0] || 0 };
                        this.drawGrid(v, {x:0, y:0}); this.drawAxes(v, {x:0, y:0}); this.drawArrow(0, 0, v.x, v.y, basisColors.i);
                    } else {
                        const iHat = state.cols > 0 ? {x: row0[0] || 0, y: row1[0] || 0} : {x:0, y:0};
                        const jHat = state.cols > 1 ? {x: row0[1] || 0, y: row1[1] || 0} : {x:0, y:0};
                        this.drawGrid(iHat, jHat); this.drawAxes(iHat, jHat);
                        if (state.cols > 0) this.drawArrow(0, 0, iHat.x, iHat.y, basisColors.i);
                        if (state.cols > 1) this.drawArrow(0, 0, jHat.x, jHat.y, basisColors.j);
                        if (state.cols > 2) {
                            const kHat = {x: row0[2] || 0, y: row1[2] || 0};
                            this.drawArrow(0, 0, kHat.x, kHat.y, basisColors.k);
                        }
                    }
                    if (state.useArbitraryVector && state.transformedVector) {
                        this.drawArrow(0, 0, state.transformedVector[0], state.transformedVector[1], arbitraryVectorColor, 0.07);
                    }
                }
                ctx.restore();
            }

            drawGrid(iHat, jHat) {
                const ctx = this.ctx; ctx.strokeStyle = '#4a5568'; ctx.lineWidth = 0.02;
                for (let i = -20; i <= 20; i++) {
                    const p1 = { x: i * iHat.x - 20 * jHat.x, y: i * iHat.y - 20 * jHat.y };
                    const p2 = { x: i * iHat.x + 20 * jHat.x, y: i * iHat.y + 20 * jHat.y };
                    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    const p3 = { x: -20 * iHat.x + i * jHat.x, y: -20 * iHat.y + i * jHat.y };
                    const p4 = { x: 20 * iHat.x + i * jHat.x, y: 20 * iHat.y + i * jHat.y };
                    ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
                }
            }

            drawAxes(iHat, jHat){
                const ctx = this.ctx; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 0.04;
                const p1 = { x: -20 * iHat.x, y: -20 * iHat.y }; const p2 = { x: 20 * iHat.x, y: 20 * iHat.y };
                ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                const p3 = { x: -20 * jHat.x, y: -20 * jHat.y }; const p4 = { x: 20 * jHat.x, y: 20 * jHat.y };
                ctx.beginPath(); ctx.moveTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.stroke();
            }

            drawArrow(x1, y1, x2, y2, color, lineWidth = 0.05) {
                const ctx = this.ctx; ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
                const headlen = 0.2; const dx = x2 - x1; const dy = y2 - y1;
                if (dx*dx + dy*dy < 0.001) return;
                const angle = Math.atan2(dy, dx);
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                ctx.closePath(); ctx.fill();
            }

            drawCrosshair(x, y, color) {
                const ctx = this.ctx; ctx.strokeStyle = color; ctx.lineWidth = 0.03;
                const s = 0.16;
                ctx.beginPath(); ctx.arc(x, y, s, 0, 2 * Math.PI, false);
                ctx.moveTo(x, y + s / 2); ctx.lineTo(x, y + s * 1.5); ctx.moveTo(x, y - s / 2); ctx.lineTo(x, y - s * 1.5);
                ctx.moveTo(x + s / 2, y); ctx.lineTo(x + s * 1.5, y); ctx.moveTo(x - s / 2, y); ctx.lineTo(x - s * 1.5, y);
                ctx.stroke();
            }

            update() { this.draw(); }
        }

        class Canvas3D extends CanvasBase {
             constructor(containerId, isInput = false) {
                super(containerId); this.isInput = isInput; this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x1e293b);
                const aspect = this.container.clientWidth / this.container.clientHeight; const frustumSize = 10;
                this.camera = new THREE.OrthographicCamera(frustumSize * aspect / -2, frustumSize * aspect / 2, frustumSize / 2, frustumSize / -2, 0.1, 100);
                this.camera.position.set(5, 5, 5); this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(this.container.clientWidth, this.container.clientHeight); this.container.appendChild(this.renderer.domElement);
                this.controls = new OrbitControls(this.camera, this.renderer.domElement); this.controls.enableDamping = true;
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.8)); const dirLight = new THREE.DirectionalLight(0xffffff, 0.7); dirLight.position.set(5, 10, 7.5); this.scene.add(dirLight);
                this.mainGroup = new THREE.Group(); this.scene.add(this.mainGroup);

                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.dragTarget = null;
                this.dragPlane = new THREE.Plane();
                this.dragOffset = new THREE.Vector3();
                this.arbitraryVectorHandle = null;

                if (this.isInput) {
                    this.addEventListeners();
                }

                this.animate(); window.addEventListener('resize', () => this.resize());
            }

            addEventListeners() {
                this.renderer.domElement.addEventListener('mousedown', this.onMouseDown.bind(this));
                this.renderer.domElement.addEventListener('mousemove', this.onMouseMove.bind(this));
                this.renderer.domElement.addEventListener('mouseup', this.onMouseUp.bind(this));
            }

            onMouseDown(event) {
                const rect = this.renderer.domElement.getBoundingClientRect();
                this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                this.raycaster.setFromCamera(this.mouse, this.camera);

                if (this.arbitraryVectorHandle) {
                    const intersects = this.raycaster.intersectObject(this.arbitraryVectorHandle);
                    if (intersects.length > 0) {
                        this.dragTarget = this.arbitraryVectorHandle;
                        this.controls.enabled = false;
                        this.camera.getWorldDirection(this.dragPlane.normal);
                        this.dragPlane.setFromNormalAndCoplanarPoint(this.dragPlane.normal, intersects[0].point);
                        this.dragOffset.copy(intersects[0].point).sub(this.dragTarget.position);
                    }
                }
            }

            onMouseMove(event) {
                if (this.dragTarget) {
                    const rect = this.renderer.domElement.getBoundingClientRect();
                    this.mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    this.mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                    this.raycaster.setFromCamera(this.mouse, this.camera);

                    const intersection = new THREE.Vector3();
                    this.raycaster.ray.intersectPlane(this.dragPlane, intersection);

                    const newPos = intersection.sub(this.dragOffset);

                    const snappedX = Math.round(newPos.x * 10) / 10;
                    const snappedY = Math.round(newPos.y * 10) / 10;
                    const snappedZ = Math.round(newPos.z * 10) / 10;

                    document.getElementById('v0').value = snappedX.toFixed(1);
                    document.getElementById('v1').value = snappedY.toFixed(1);
                    if (state.cols > 2) document.getElementById('v2').value = snappedZ.toFixed(1);

                    handleMatrixChange();
                }
            }

            onMouseUp() {
                this.dragTarget = null;
                this.controls.enabled = true;
            }

            resize() {
                const aspect = this.container.clientWidth / this.container.clientHeight; const frustumSize = 10;
                this.camera.left = frustumSize * aspect / -2; this.camera.right = frustumSize * aspect / 2;
                this.camera.top = frustumSize / 2; this.camera.bottom = frustumSize / -2;
                this.camera.updateProjectionMatrix(); this.renderer.setSize(this.container.clientWidth, this.container.clientHeight);
            }

            animate() { requestAnimationFrame(() => this.animate()); this.controls.update(); this.renderer.render(this.scene, this.camera); }

            update() {
                this.mainGroup.clear(); this.mainGroup.add(new THREE.AxesHelper(5));
                const gridColor = 0x475569; const gridSize = 10; const gridDivs = 10;
                const gridXZ = new THREE.GridHelper(gridSize, gridDivs, gridColor, gridColor); this.mainGroup.add(gridXZ);
                const gridXY = new THREE.GridHelper(gridSize, gridDivs, gridColor, gridColor); gridXY.rotation.x = Math.PI / 2; this.mainGroup.add(gridXY);
                const gridYZ = new THREE.GridHelper(gridSize, gridDivs, gridColor, gridColor); gridYZ.rotation.z = Math.PI / 2; this.mainGroup.add(gridYZ);

                const origin = new THREE.Vector3(0,0,0);
                const basis = [
                    { vec: new THREE.Vector3(1,0,0), color: parseInt(basisColors.i.slice(1), 16) },
                    { vec: new THREE.Vector3(0,1,0), color: parseInt(basisColors.j.slice(1), 16) },
                    { vec: new THREE.Vector3(0,0,1), color: parseInt(basisColors.k.slice(1), 16) },
                ];

                if (this.isInput) {
                    for(let c=0; c < state.cols; c++) this.mainGroup.add(new THREE.ArrowHelper(basis[c].vec, origin, 1, basis[c].color, 0.3, 0.15));
                    if (state.useArbitraryVector) {
                        const v = new THREE.Vector3().fromArray(state.arbitraryVector);
                        if(v.length() > 1e-6) {
                           const arrow = new THREE.ArrowHelper(v.clone().normalize(), origin, v.length(), parseInt(arbitraryVectorColor.slice(1), 16), 0.3, 0.15);
                           this.mainGroup.add(arrow);
                           // Add invisible handle for dragging
                           const handleGeom = new THREE.SphereGeometry(0.3);
                           const handleMat = new THREE.MeshBasicMaterial({visible: false});
                           this.arbitraryVectorHandle = new THREE.Mesh(handleGeom, handleMat);
                           this.arbitraryVectorHandle.position.copy(v);
                           this.mainGroup.add(this.arbitraryVectorHandle);
                        }
                    } else {
                        this.arbitraryVectorHandle = null;
                    }
                } else {
                    const row0 = state.matrix[0] || [];
                    const row1 = state.matrix[1] || [];
                    const row2 = state.matrix[2] || [];

                    for(let c=0; c < state.cols; c++) {
                        const vec = new THREE.Vector3();
                        if (state.rows > 0) vec.x = row0[c] || 0;
                        if (state.rows > 1) vec.y = row1[c] || 0;
                        if (state.rows > 2) vec.z = row2[c] || 0;
                        if(vec.length() > 1e-6) this.mainGroup.add(new THREE.ArrowHelper(vec.clone().normalize(), origin, vec.length(), basis[c].color, 0.3, 0.15));
                    }
                    if (state.useArbitraryVector && state.transformedVector) {
                        const v = new THREE.Vector3().fromArray(state.transformedVector);
                        if(v.length() > 1e-6) this.mainGroup.add(new THREE.ArrowHelper(v.clone().normalize(), origin, v.length(), parseInt(arbitraryVectorColor.slice(1), 16), 0.3, 0.15));
                    }
                    this.drawTransformedSpace();
                }
            }

            drawTransformedSpace() {
                const spaceGroup = new THREE.Group();
                const lineMaterial = new THREE.LineBasicMaterial({ color: parseInt(subspaceColor.slice(1), 16) });

                if (state.cols === 1) {
                    const v = new THREE.Vector3().fromArray(state.matrix.map(row => row[0]));
                    const lineGeom = new THREE.BufferGeometry().setFromPoints([v.clone().multiplyScalar(-10), v.clone().multiplyScalar(10)]);
                    spaceGroup.add(new THREE.Line(lineGeom, lineMaterial));
                } else if (state.cols === 2) {
                    const v1 = new THREE.Vector3().fromArray(state.matrix.map(row => row[0]));
                    const v2 = new THREE.Vector3().fromArray(state.matrix.map(row => row[1]));
                    if (v1.clone().cross(v2).length() > 1e-6) {
                        const gridSize = 10;
                        for(let i = -gridSize; i <= gridSize; i++) {
                            const start1 = v1.clone().multiplyScalar(i).add(v2.clone().multiplyScalar(-gridSize));
                            const end1 = v1.clone().multiplyScalar(i).add(v2.clone().multiplyScalar(gridSize));
                            spaceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([start1, end1]), lineMaterial));

                            const start2 = v2.clone().multiplyScalar(i).add(v1.clone().multiplyScalar(-gridSize));
                            const end2 = v2.clone().multiplyScalar(i).add(v1.clone().multiplyScalar(gridSize));
                            spaceGroup.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([start2, end2]), lineMaterial));
                        }
                    } else {
                        const v = v1.length() > v2.length() ? v1 : v2;
                        const lineGeom = new THREE.BufferGeometry().setFromPoints([v.clone().multiplyScalar(-10), v.clone().multiplyScalar(10)]);
                        spaceGroup.add(new THREE.Line(lineGeom, lineMaterial));
                    }
                } else if (state.cols === 3) {
                     const spaceMaterial = new THREE.MeshBasicMaterial({ color: parseInt(subspaceColor.slice(1), 16), side: THREE.DoubleSide, transparent: true, opacity: 0.5, wireframe: true });
                     const boxGeom = new THREE.BoxGeometry(1, 1, 1);
                     const v1 = new THREE.Vector3().fromArray(state.matrix.map(row => row[0]));
                     const v2 = new THREE.Vector3().fromArray(state.matrix.map(row => row[1]));
                     const v3 = new THREE.Vector3().fromArray(state.matrix.map(row => row[2]));
                     const mat = new THREE.Matrix4().makeBasis(v1, v2, v3);
                     boxGeom.applyMatrix4(mat);
                     spaceGroup.add(new THREE.Mesh(boxGeom, spaceMaterial));
                }
                this.mainGroup.add(spaceGroup);
            }
        }

        // --- UI and Logic ---
        function setupUI() {
            document.getElementById('dim-select').addEventListener('change', handleDimChange);
            document.getElementById('matrix-grid-container').addEventListener('input', handleMatrixChange);
            setupArbitraryVectorUI();
            updateMatrixUI();
            updateVisualizers();
            handleMatrixChange();
        }

        function setupArbitraryVectorUI() {
            const checkbox = document.getElementById('use-arbitrary-vector-checkbox');
            checkbox.addEventListener('change', (e) => {
                state.useArbitraryVector = e.target.checked;
                updateArbitraryVectorInputs();
                handleMatrixChange();
            });
        }

        function updateArbitraryVectorInputs() {
            const wrapper = document.getElementById('arbitrary-vector-inputs-wrapper');
            const container = document.getElementById('arbitrary-vector-inputs');
            const analysisContainer = document.getElementById('transformed-vector-analysis');
            container.innerHTML = '';
            if (state.useArbitraryVector) {
                wrapper.style.display = 'flex';
                analysisContainer.style.display = 'block';
                for (let i = 0; i < state.cols; i++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = `v${i}`;
                    input.className = `matrix-input col-v`;
                    input.value = state.arbitraryVector[i] || 0;
                    input.step = 0.1;
                    container.appendChild(input);
                    input.addEventListener('input', handleMatrixChange);
                }
            } else {
                wrapper.style.display = 'none';
                analysisContainer.style.display = 'none';
            }
        }

        function handleDimChange(e) {
            const [rows, cols] = e.target.value.split('x').map(Number);
            state.rows = rows; state.cols = cols;
            document.getElementById('use-arbitrary-vector-checkbox').checked = false;
            state.useArbitraryVector = false;
            updateMatrixUI();
            updateVisualizers();
            updateArbitraryVectorInputs();
            handleMatrixChange();
        }

        function handleMatrixChange() {
            state.matrix = getMatrixFromUI();
            if (state.useArbitraryVector) {
                for (let i=0; i<state.cols; i++) {
                    state.arbitraryVector[i] = parseFloat(document.getElementById(`v${i}`).value) || 0;
                }
                state.transformedVector = numeric.dot(state.matrix, state.arbitraryVector.slice(0, state.cols));
            }
            state.inputVis.update();
            state.outputVis.update();
            updateAnalysis();
        }

        function updateMatrixUI() {
            const container = document.getElementById('matrix-inputs');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${state.cols}, minmax(0, 1fr))`;

            const colClasses = ['col-i', 'col-j', 'col-k'];
            for(let r = 0; r < state.rows; r++) {
                for(let c = 0; c < state.cols; c++) {
                    const input = document.createElement('input');
                    input.type = 'number';
                    input.id = `m${r}${c}`;
                    input.className = `matrix-input ${colClasses[c]}`;
                    input.value = (r === c) ? 1 : 0;
                    if (state.rows === 1 && state.cols === 2 && c === 1) {
                         input.value = 0;
                    }
                    input.step = 0.1;
                    container.appendChild(input);
                }
            }
        }

        function getMatrixFromUI() {
            const matrix = [];
            for(let r=0; r<state.rows; r++) {
                const row = [];
                for(let c=0; c<state.cols; c++) row.push(parseFloat(document.getElementById(`m${r}${c}`).value) || 0);
                matrix.push(row);
            }
            return matrix;
        }

        function updateVisualizers() {
            if (state.inputVis) state.inputVis.dispose(); if (state.outputVis) state.outputVis.dispose();
            state.inputVis = createVisualizer('canvas-container-in', state.cols, true);
            state.outputVis = createVisualizer('canvas-container-out', state.rows, false);
        }

        function createVisualizer(containerId, dim, isInput) {
            if (dim === 1) return new Canvas1D(containerId, isInput);
            if (dim === 2) return new Canvas2D(containerId, isInput);
            if (dim === 3) return new Canvas3D(containerId, isInput);
        }

        function getRank(matrix) {
            if (!matrix || matrix.length === 0 || !matrix[0] || matrix[0].length === 0) return 0;
            let m = matrix.map(row => [...row]); let rows = m.length; let cols = m[0].length;
            let rank = 0;
            for (let j = 0; j < cols && rank < rows; j++) {
                let pivot_row = rank;
                while (pivot_row < rows && Math.abs(m[pivot_row][j]) < 1e-9) pivot_row++;
                if (pivot_row < rows) {
                    [m[rank], m[pivot_row]] = [m[pivot_row], m[rank]];
                    let pivot = m[rank][j];
                    for (let k = j; k < cols; k++) m[rank][k] /= pivot;
                    for (let i = 0; i < rows; i++) {
                        if (i !== rank) {
                            let factor = m[i][j];
                            for (let k = j; k < cols; k++) m[i][k] -= factor * m[rank][k];
                        }
                    }
                    rank++;
                }
            }
            return rank;
        }

        function updateAnalysis() {
            const rank = getRank(state.matrix);
            const nullity = state.cols - rank;
            const tr = window.LabI18n.t;
            document.getElementById('rank-value').textContent = rank;
            document.getElementById('nullity-value').textContent = nullity;

            let imageDesc = tr(
                `A subspace of &#x211D;<sup>${state.rows}</sup> with dimension ${rank}.`,
                `Un subespacio de &#x211D;<sup>${state.rows}</sup> de dimensión ${rank}.`
            );
            if(rank === 0) imageDesc = tr("The origin {0}.", "El origen {0}.");
            else if(rank === state.rows) imageDesc = tr(
                `The entire space &#x211D;<sup>${state.rows}</sup>.`,
                `Todo el espacio &#x211D;<sup>${state.rows}</sup>.`
            );
            document.getElementById('image-value').innerHTML = imageDesc;

            let kernelDesc = tr(
                `A subspace of &#x211D;<sup>${state.cols}</sup> with dimension ${nullity}.`,
                `Un subespacio de &#x211D;<sup>${state.cols}</sup> de dimensión ${nullity}.`
            );
            if (nullity === 0) kernelDesc = tr("Only the origin {0}.", "Solo el origen {0}.");
            else if (nullity === state.cols) kernelDesc = tr(
                `The entire input space &#x211D;<sup>${state.cols}</sup>.`,
                `Todo el espacio de entrada &#x211D;<sup>${state.cols}</sup>.`
            );
            document.getElementById('kernel-value').innerHTML = kernelDesc;

            if (state.useArbitraryVector && state.transformedVector) {
                const vecStr = Array.isArray(state.transformedVector)
                    ? state.transformedVector.map(n => n.toFixed(2)).join(', ')
                    : Number(state.transformedVector).toFixed(2);
                document.getElementById('transformed-vector-value').textContent = `[${vecStr}]`;
            }
        }

        // --- Initializer ---
        document.addEventListener('DOMContentLoaded', setupUI);

    </script>
</body>
</html>
